[project]
name = "context-bench"
version = "0.1.0"
description = "RAG vs CAG vs MAG, measured. Where each strategy wins, what it costs, and where the crossover is."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
llm = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contextbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# `corpus` is part of the Strategy interface that every subclass must accept; only CAG
# reads it. Dropping it from the signature would break the polymorphism the harness needs.
"src/contextbench/strategies.py" = ["ARG002"]
# A literal list of ninety stopwords is unreadable. The concatenated strings group them
# by purpose - articles, auxiliaries, prepositions, interrogatives - which is the point.
"src/contextbench/retrieval.py" = ["SIM905"]
